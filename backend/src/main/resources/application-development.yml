spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/casciz_commerce
    username: casciz_user
    password: casciz_pass
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    root: INFO
    com.casciz: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

springdoc:
  swagger-ui:
    enabled: true

casciz:
  jwt:
    secret: development-only-secret-do-not-use-in-production-must-be-64-chars
    access-token-expiry-ms: 3600000     # 1h in dev
    refresh-token-expiry-ms: 604800000  # 7d
