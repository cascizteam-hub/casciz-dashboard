name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Spring Boot)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB:       casciz_commerce_test
          POSTGRES_USER:     casciz_user
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL:      jdbc:postgresql://localhost:5432/casciz_commerce_test
          SPRING_DATASOURCE_USERNAME: casciz_user
          SPRING_DATASOURCE_PASSWORD: test_password
          JWT_SECRET:                 test-secret-that-is-at-least-64-characters-for-ci-build-ok
          SPRING_PROFILES_ACTIVE:     development
        run: mvn test -B

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (Next.js 15)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type check
        working-directory: frontend
        run: npm run type-check

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_APP_NAME:     Casciz Commerce OS
          NEXT_PUBLIC_APP_URL:      http://localhost:3000
          NEXTAUTH_URL:             http://localhost:3000
          NEXTAUTH_SECRET:          ci-test-secret-32-chars-minimum
        run: npm run build

  # ── Docker build (smoke test) ─────────────────────────────────────────────
  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --target production -t casciz-backend:ci ./backend

      - name: Build frontend image
        run: docker build --target production -t casciz-frontend:ci ./frontend
